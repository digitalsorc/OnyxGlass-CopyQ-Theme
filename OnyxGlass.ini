css="\r
    #ClipboardBrowser {\r
        outline: 0;\r
    }\r
\r
    QToolTip {\r
        background: #11161f;\r
        color: #d6dce7;\r
        border: 1px solid #31445f;\r
        border-radius: 4px;\r
        padding: 3px 7px;\r
        font-size: 9pt;\r
    }\r
\r
    QScrollBar:vertical {\r
        background: transparent;\r
        width: 5px;\r
        margin: 0;\r
        border: 0;\r
    }\r
    QScrollBar::handle:vertical {\r
        background: #263141;\r
        border-radius: 2px;\r
        min-height: 24px;\r
    }\r
    QScrollBar::handle:vertical:hover {\r
        background: #51739f;\r
    }\r
    QScrollBar::handle:vertical:pressed {\r
        background: #8fb4ff;\r
    }\r
    QScrollBar::add-line:vertical,\r
    QScrollBar::sub-line:vertical,\r
    QScrollBar::add-page:vertical,\r
    QScrollBar::sub-page:vertical {\r
        background: transparent;\r
        height: 0;\r
        width: 0;\r
    }\r
\r
    QScrollBar:horizontal {\r
        background: transparent;\r
        height: 5px;\r
        margin: 0;\r
        border: 0;\r
    }\r
    QScrollBar::handle:horizontal {\r
        background: #263141;\r
        border-radius: 2px;\r
        min-width: 24px;\r
    }\r
    QScrollBar::handle:horizontal:hover {\r
        background: #51739f;\r
    }\r
    QScrollBar::handle:horizontal:pressed {\r
        background: #8fb4ff;\r
    }\r
    QScrollBar::add-line:horizontal,\r
    QScrollBar::sub-line:horizontal,\r
    QScrollBar::add-page:horizontal,\r
    QScrollBar::sub-page:horizontal {\r
        background: transparent;\r
        height: 0;\r
        width: 0;\r
    }\r
\r
    QMenu::item {\r
        padding: 5px 22px 5px 14px;\r
        border-radius: 4px;\r
        margin: 1px 4px;\r
    }\r
    QMenu::item:selected {\r
        background: #182131;\r
        color: #e6eefc;\r
    }\r
    QMenu::separator {\r
        height: 1px;\r
        background: #212834;\r
        margin: 3px 8px;\r
    }"
